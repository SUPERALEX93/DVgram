<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Messenger - Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">N</div>
                <h1>Nexus Messenger</h1>
                <p>Объединяем людей, идеи и миры</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-username">Логин</label>
                    <input type="text" id="login-username" placeholder="Введите ваш логин" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" placeholder="Введите ваш пароль" required>
                </div>
                <button type="submit" class="btn-primary">Войти</button>
                <div class="error-message" id="login-error"></div>
            </form>
            
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-username">Логин</label>
                    <input type="text" id="register-username" placeholder="Придумайте логин (мин. 3 символа)" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="register-password">Пароль</label>
                    <input type="password" id="register-password" placeholder="Придумайте пароль (мин. 6 символов)" required minlength="6">
                </div>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
                <div class="error-message" id="register-error"></div>
            </form>
            
            <div class="auth-footer">
                <p>Демо-аккаунт: <strong>NexusAdmin</strong> / <strong>admin123</strong></p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
